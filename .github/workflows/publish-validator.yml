name: Publish validator archive

on:
  workflow_call:
    inputs:
      tag:
        description: Existing stable release tag, such as v0.1.0
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag, such as v0.1.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: validator-archive-${{ inputs.tag }}
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Validate stable semver tag
        run: '[[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]'
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preserve publisher checks for older releases
        run: |
          cp packages/validator/test/install.test.ts "$RUNNER_TEMP/validator-install.test.ts"
          cp scripts/check-release-version.ts "$RUNNER_TEMP/check-release-version.ts"
      - uses: pnpm/action-setup@v4
        with:
          version: "12"
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require a published release from main history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = false
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Require matched release versions
        run: node "$RUNNER_TEMP/check-release-version.ts"
      - name: Install locked dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Typecheck
        run: pnpm typecheck
      - name: Test, build and verify packed consumers
        run: pnpm test
      - name: Audit dependencies
        run: pnpm audit --audit-level=high
      - name: Pack the compiled validator
        run: |
          mkdir -p "$RUNNER_TEMP/validator-artifact"
          pnpm --filter @lazydata/validator pack --pack-destination "$RUNNER_TEMP/validator-artifact"
      - name: Verify installation of the exact release archive
        run: |
          export VALIDATOR_VERSION="${RELEASE_TAG#v}"
          export VALIDATOR_ARCHIVE="$RUNNER_TEMP/validator-artifact/lazydata-validator-$VALIDATOR_VERSION.tgz"
          node --test "$RUNNER_TEMP/validator-install.test.ts"
      - name: Upload without replacing an existing semver asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "$RUNNER_TEMP/validator-artifact/lazydata-validator-${RELEASE_TAG#v}.tgz" \
            --repo "$GITHUB_REPOSITORY"
